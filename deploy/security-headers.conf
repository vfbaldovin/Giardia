# Antete de securitate pentru giardia.ro.
#
# Se include in FIECARE bloc "location" care are propriul add_header:
# in nginx, un add_header intr-un location sterge complet cele mostenite
# de la server. Fara includerea asta, rutele cu cache ar ramane fara HSTS.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CSP: totul din propriul domeniu. Exceptiile sunt strict cele necesare —
# Spotify (iframe cu player-ul) si 'unsafe-inline' pentru stilurile pe care
# le pune Astro inline la build.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.scdn.co https://image-cdn-ak.spotifycdn.com https://image-cdn-fa.spotifycdn.com; font-src 'self'; frame-src https://open.spotify.com; media-src 'self' https://p.scdn.co; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
