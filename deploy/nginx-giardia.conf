# giardia.ro — site static (Astro), servit de nginx.
#
# Structura:
#   :80  orice domeniu  -> 301 catre https://giardia.ro (mai putin ACME)
#   :443 www.giardia.ro -> 301 catre https://giardia.ro
#   :443 giardia.ro     -> site-ul
#
# Instalare:  deploy/deploy.sh --nginx

# --------------------------------------------------------------------------
# HTTP: doar ACME si redirect. Nimic nu se serveste pe 80.
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name giardia.ro www.giardia.ro;

    # Provocarea ACME trebuie sa ramana pe HTTP, altfel reinnoirea pica.
    # "^~" ca sa bata orice location regex.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/giardia;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://giardia.ro$request_uri;
    }
}

# --------------------------------------------------------------------------
# HTTPS www -> non-www. O singura forma canonica.
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.giardia.ro;

    ssl_certificate     /etc/letsencrypt/live/giardia.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/giardia.ro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://giardia.ro$request_uri;
}

# --------------------------------------------------------------------------
# HTTPS — site-ul
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name giardia.ro;

    root /var/www/giardia;
    index index.html;
    charset utf-8;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/giardia.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/giardia.ro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;   # TLS 1.2/1.3 + cifruri
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Fara ssl_stapling: Let's Encrypt a scos URL-ul OCSP din certificate,
    # asa ca nginx ignora directiva si doar logheaza un avertisment.
    # Revocarea se verifica azi prin CRL, la nivel de browser.

    include /etc/nginx/snippets/giardia-headers.conf;

    # Fara slash final, ca sa se potriveasca cu <link rel="canonical">.
    # (.+) si nu (.*), altfel "/" s-ar redirecta catre gol.
    rewrite ^/(.+)/$ https://giardia.ro/$1 permanent;

    # ---- compresie (nginx 1.18 fara brotli => doar gzip) ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml font/ttf;

    # ---- ACME (si pe 443, pentru reinnoiri) ----
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/giardia;
        default_type "text/plain";
        allow all;
    }

    # ---- cache ----
    # _astro/ si fonts/ au hash in nume => imutabile un an.
    location /_astro/ {
        include /etc/nginx/snippets/giardia-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        include /etc/nginx/snippets/giardia-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /brand/ {
        include /etc/nginx/snippets/giardia-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # Icoane si imaginea de share: fara hash, deci cache scurt.
    location ~* ^/(favicon\.svg|favicon-\d+\.png|apple-touch-icon\.png|og\.jpg|site\.webmanifest)$ {
        include /etc/nginx/snippets/giardia-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # Fisiere pentru crawlere.
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        include /etc/nginx/snippets/giardia-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # HTML: revalidare la fiecare cerere, altfel un deploy nou nu se vede.
    location ~* \.html$ {
        include /etc/nginx/snippets/giardia-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = / {
        include /etc/nginx/snippets/giardia-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files /index.html =404;
    }

    # ---- rutare ----
    # Astro scoate /joc/index.html; il servim direct la /joc, fara redirect.
    location / {
        include /etc/nginx/snippets/giardia-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;
}
